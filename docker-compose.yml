services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asia26}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-asia26}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${HOST_DB_PORT:-5432}:5432' # remove/restrict in production; local-only for admin access
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-asia26}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-asia26}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-asia26}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://asia26.ygouf.com}
      UPLOAD_DIR: uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - '127.0.0.1:${HOST_BACKEND_PORT:-4000}:4000' # Caddy (on the host) proxies to this port; not exposed publicly

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '127.0.0.1:${HOST_FRONTEND_PORT:-3003}:80' # Caddy (on the host) proxies to this port; not exposed publicly

volumes:
  db_data:
  backend_uploads:
